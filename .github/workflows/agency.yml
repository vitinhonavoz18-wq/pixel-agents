name: PIXEL AGENCY

# Tests and builds for the agency/ monorepo (backend, app, desktop bridge),
# plus cloud-only jobs:
#   - android_apk: builds the Android APK with Gradle on the runner (no Expo
#     account needed) and publishes it as a GitHub Release asset. Runs on every
#     push to agency/ and on demand.
# and two manual jobs you can trigger from a phone/tablet in the GitHub UI
# (Actions → PIXEL AGENCY → Run workflow):
#   - build_apk: Android APK on Expo EAS (needs repo secret EXPO_TOKEN and
#     repo variable EAS_PROJECT_ID)
#   - deploy_web: the web build to GitHub Pages (needs Pages enabled with
#     "GitHub Actions" as the source)

on:
  push:
    paths:
      - 'agency/**'
      - 'webview-ui/src/**'
      - 'webview-ui/vite.agency.config.ts'
      - '.github/workflows/agency.yml'
  pull_request:
    paths:
      - 'agency/**'
      - 'webview-ui/src/**'
      - 'webview-ui/vite.agency.config.ts'
      - '.github/workflows/agency.yml'
  workflow_dispatch:
    inputs:
      build_apk:
        description: 'Gerar APK Android no Expo EAS (perfil preview)'
        type: boolean
        default: false
      deploy_web:
        description: 'Publicar a versão web no GitHub Pages'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: agency-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - name: Install root deps (office build reuses the Pixel Agents webview)
        run: npm ci --ignore-scripts
      - name: Install agency deps
        working-directory: agency
        run: npx -y npm@11 ci
      - name: Office layout + single-file office build
        working-directory: agency
        run: npm run office:build
      - name: Typecheck
        working-directory: agency
        run: npm run typecheck
      - name: Tests
        working-directory: agency
        run: npm test
      - name: Backend bundle
        working-directory: agency
        run: npm run backend:build
      - name: Web build
        working-directory: agency/app
        env:
          EXPO_BASE_URL: ${{ inputs.deploy_web && format('/{0}', github.event.repository.name) || '' }}
        run: CI=1 npx expo export --platform web --output-dir dist && cp dist/index.html dist/404.html
      - uses: actions/upload-artifact@v4
        with:
          name: pixel-agency-web
          path: agency/app/dist
          retention-days: 14

  deploy_web:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_web
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pixel-agency-web
          path: site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4

  android_apk:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install agency deps
        working-directory: agency
        run: npx -y npm@11 ci
      - name: Generate the native Android project
        working-directory: agency/app
        run: CI=1 npx expo prebuild --platform android --clean --no-install
      - name: Assemble release APK
        working-directory: agency/app/android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a
      - name: Name the APK
        id: apk
        run: |
          VERSION=$(node -p "require('./agency/app/package.json').version")
          cp agency/app/android/app/build/outputs/apk/release/app-release.apk "pixel-agency-$VERSION.apk"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "file=pixel-agency-$VERSION.apk" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: pixel-agency-apk
          path: ${{ steps.apk.outputs.file }}
          retention-days: 30
      - name: Publish GitHub Release (pre-release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: agency-v${{ steps.apk.outputs.version }}
          name: PIXEL AGENCY ${{ steps.apk.outputs.version }} (Android APK)
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: ${{ steps.apk.outputs.file }}
          body: |
            APK de instalação direta (sideload) do PIXEL AGENCY ${{ steps.apk.outputs.version }}, gerado pelo Gradle no GitHub Actions a partir do commit ${{ github.sha }}.
            Assinado com a chave de depuração do React Native: serve para instalar e testar; para a Play Store use o build `production` do EAS.
            Sem backend configurado o app abre em MODO DEMO (sinalizado na tela).

  build_apk:
    if: github.event_name == 'workflow_dispatch' && inputs.build_apk
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - name: Check EAS credentials
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_PROJECT_ID: ${{ vars.EAS_PROJECT_ID }}
        run: |
          if [ -z "$EXPO_TOKEN" ] || [ -z "$EAS_PROJECT_ID" ]; then
            echo "::error::Defina o secret EXPO_TOKEN e a variável EAS_PROJECT_ID (veja agency/docs/BUILD-ANDROID.md)."
            exit 1
          fi
      - name: Install agency deps
        working-directory: agency
        run: npx -y npm@11 ci
      - name: Pin the EAS project id for the build worker
        working-directory: agency/app
        env:
          EAS_PROJECT_ID: ${{ vars.EAS_PROJECT_ID }}
        run: echo "{\"expo\":{\"extra\":{\"eas\":{\"projectId\":\"$EAS_PROJECT_ID\"}}}}" > app.json
      - name: Start EAS build (APK, perfil preview)
        working-directory: agency/app
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_PROJECT_ID: ${{ vars.EAS_PROJECT_ID }}
        run: npx -y eas-cli@latest build --platform android --profile preview --non-interactive --no-wait
